name: Release

on:
  push:
    tags: ['v*']

jobs:
  zip:
    name: GitHub-Release mit ZIP
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: ZIP nach .distignore bauen
        run: |
          set -euo pipefail
          mkdir -p dist/barrierepruefung-de-web-accessibility-checker
          rsync -a --exclude='/dist' --exclude-from=.distignore ./ dist/barrierepruefung-de-web-accessibility-checker/
          cd dist && zip -r barrierepruefung-de-web-accessibility-checker.zip barrierepruefung-de-web-accessibility-checker

      - name: Pruefen, dass nichts Fremdes im ZIP liegt
        run: |
          set -euo pipefail
          unzip -l dist/barrierepruefung-de-web-accessibility-checker.zip
          ! unzip -l dist/barrierepruefung-de-web-accessibility-checker.zip | grep -E 'vendor/|tests/|composer\.json'

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/barrierepruefung-de-web-accessibility-checker.zip
          generate_release_notes: true

  wporg:
    name: Deploy ins Plugin-Verzeichnis
    needs: zip
    runs-on: ubuntu-latest
    # Abgeschaltet, solange es weder Slug noch SVN-Zugang gibt. Scharfschalten:
    # Repository-Variable WPORG_DEPLOY auf "true" setzen und die beiden Secrets
    # hinterlegen. Vorher SLUG unten auf den beim Review vergebenen Slug ziehen
    # - und mit ihm die Text-Domain (siehe CLAUDE.md). Achtung: Dieser Job checkt
    # roh aus und muss vor dem Scharfschalten stattdessen den bereits nach
    # .distignore bereinigten Baum aus dem zip-Job verwenden, sonst landen
    # tests/, composer.json und .github/ im SVN.
    if: vars.WPORG_DEPLOY == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: barrierepruefung-de-web-accessibility-checker
          ASSETS_DIR: assets
