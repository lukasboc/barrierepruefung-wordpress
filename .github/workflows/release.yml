name: Release

on:
  push:
    tags: ['v*']
  # Nachliefern eines Tags, dessen Deploy gescheitert oder abgeschaltet war: „Run workflow"
  # mit dem Tag (nicht main) als Ref. Ohne Haken bei dry-run wird wirklich committet.
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Deploy nur durchspielen, nichts ins SVN committen'
        type: boolean
        default: true

jobs:
  zip:
    name: GitHub-Release mit ZIP
    # Ein Lauf von einem Branch hätte weder Version noch Release.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Das Verzeichnis liefert aus, was unter „Stable tag" steht, nicht das neueste Tag.
      # Laufen die drei auseinander, landet eine Version im SVN, die niemand bekommt.
      - name: Tag, Plugin-Kopf und Stable tag muessen uebereinstimmen
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          kopf=$(sed -n 's/^ \* Version: *//p' barrierepruefung-de-web-accessibility-checker.php)
          stable=$(sed -n 's/^Stable tag: *//p' readme.txt)
          echo "Tag: $tag, Plugin-Kopf: $kopf, Stable tag: $stable"
          [ "$tag" = "$kopf" ] && [ "$tag" = "$stable" ]

      - name: ZIP nach .distignore bauen
        run: |
          set -euo pipefail
          mkdir -p dist/barrierepruefung-de-web-accessibility-checker
          rsync -a --exclude='/dist' --exclude-from=.distignore ./ dist/barrierepruefung-de-web-accessibility-checker/
          cd dist && zip -r barrierepruefung-de-web-accessibility-checker.zip barrierepruefung-de-web-accessibility-checker

      - name: Pruefen, dass nichts Fremdes im ZIP liegt
        run: |
          set -euo pipefail
          unzip -l dist/barrierepruefung-de-web-accessibility-checker.zip
          ! unzip -l dist/barrierepruefung-de-web-accessibility-checker.zip | grep -E 'vendor/|tests/|composer\.json'

      # Derselbe Baum geht ins SVN — was im Verzeichnis liegt, ist damit genau das ZIP.
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: dist/barrierepruefung-de-web-accessibility-checker/
          if-no-files-found: error

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/barrierepruefung-de-web-accessibility-checker.zip
          generate_release_notes: true

  wporg:
    name: Deploy ins Plugin-Verzeichnis
    needs: zip
    runs-on: ubuntu-latest
    # Schalter ist die Repository-Variable WPORG_DEPLOY. Sie muss im Repository liegen, nicht
    # im Environment: dieses if wird ausgewertet, bevor das Environment geladen ist.
    if: vars.WPORG_DEPLOY == 'true'
    # Die SVN-Zugangsdaten liegen nur hier, und das Environment lässt nur Tags v* heran.
    environment: wordpress-org
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: plugin
          path: build/plugin

      # Die Action spiegelt ASSETS_DIR mit --delete ins SVN; assets/README.md gehört nicht dazu.
      - name: Grafiken fuer das Verzeichnis bereitstellen
        run: mkdir -p build/assets && cp assets/*.png build/assets/

      # Ist tags/<Version> im SVN schon vorhanden, bricht die Action ohne Commit ab.
      - uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          dry-run: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run }}
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: barrierepruefung-de-web-accessibility-checker
          BUILD_DIR: build/plugin
          ASSETS_DIR: build/assets
